<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回報管理 · 花苗透視鏡</title><link rel="stylesheet" href="/site.css"><script src="/admin.js" defer></script></head>
<body><header><a class="brand" href="/">✿ 花苗透視鏡 <span>回報管理</span></a><button id="logout" class="quiet" hidden>登出</button></header>
<main><section id="login" class="card login"><div class="eyebrow">PRIVATE WORKSPACE</div><h1>維護者登入</h1><p>診斷資料僅供授權維護者查看。</p><form id="login-form"><label for="password">管理密碼</label><input id="password" type="password" autocomplete="current-password" minlength="16" maxlength="256" required><button>登入後台 →</button></form></section>
<section id="dashboard" hidden><div class="eyebrow">DIAGNOSTICS INBOX</div><div class="heading"><div><h1>問題回報</h1><p>從環境與載入結果，找到下一個修正方向。</p></div><button id="refresh" class="quiet">↻ 重新整理</button></div>
<div class="stats"><div><span>待處理</span><strong id="new-count">0</strong></div><div><span>處理中</span><strong id="investigating-count">0</strong></div><div><span>已處理</span><strong id="resolved-count">0</strong></div></div>
<form id="filters" class="filters"><label>處理狀態<select name="state"><option value="">全部狀態</option value="new">待處理</option><option value="investigating">處理中</option><option value="resolved">已處理</option></select></label><label>問題類型<select name="issue"><option value="">全部問題</option><option value="app_wont_open">App 無法開啟</option><option value="root_problem">Root 問題</option><option value="cannot_enable">無法啟用</option><option value="text_unchanged">文字未變更</option><option value="restore_problem">還原問題</option><option value="other">其他</option></select></label><label>App 版本<input name="app" placeholder="例如 0.11.2" maxlength="30"></label><label>遊戲版本<input name="game" placeholder="例如 157.0" maxlength="30"></label><label>Android API<input name="api" placeholder="例如 35" maxlength="10"></label><button>篩選</button></form>
<div class="workspace"><section class="card inbox"><div class="list-heading"><h2>診斷收件匣</h2><span id="total" class="muted"></span></div><div id="reports"></div><div class="pagination"><button id="prev" class="quiet">← 上一頁</button><span id="page"></span><button id="next" class="quiet">下一頁 →</button></div></section><section class="card detail"><h2>報告詳情</h2><p id="empty" class="muted">選擇一份回報，查看環境與事件。</p><div id="report-detail" hidden><code id="report-id"></code><p id="received" class="muted"></p><dl id="facts"></dl><h3>事件紀錄</h3><pre id="events"></pre><div class="actions"><label>處理狀態<select id="triage"><option value="new">待處理</option><option value="investigating">處理中</option><option value="resolved">已處理</option></select></label><button id="save">儲存狀態</button><a id="download" class="download">下載 JSON ↓</a></div></div></section></div><p class="footnote">每頁 25 份 · 新回報優先 · 最多保存 30 天 · 不記錄帳號或原始 IP。開頁時不會自動輪詢。</p></section><p id="message" role="status" aria-live="polite"></p></main><footer>私人診斷工作區 · odyliao-lab</footer></body></html>
