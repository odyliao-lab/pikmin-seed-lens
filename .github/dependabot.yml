version: 2
updates:
  - package-ecosystem: npm
    directory: /server/sites
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cloudflare:
        patterns: ["@cloudflare/*", "wrangler", "miniflare"]
        update-types: [minor, patch]
      framework:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "vinext", "vite", "@vitejs/*"]
        update-types: [minor, patch]
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
