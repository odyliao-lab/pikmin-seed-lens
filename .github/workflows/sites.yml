name: Sites website
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/sites
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/sites/package-lock.json
      - name: Install locked website dependencies
        run: npm run install:ci
      - name: Check website policies and connector protocol
        run: node --test tests/*.test.mjs
      - name: Check TypeScript
        run: npx --no-install tsc --noEmit
      - name: Build Worker and client
        run: npm run build
      - name: Check deployable Worker output
        run: test -s dist/server/index.js && test -s dist/server/wrangler.json
      - name: Exercise local D1 upload and admin contracts
        shell: bash
        run: |
          set -euo pipefail
          printf 'ADMIN_EMAIL=seedy@sites.test\nRATE_KEY=ci-synthetic-only-not-production\n' > .dev.vars
          npx --no-install wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file drizzle/0000_lying_infant_terrible.sql
          npx --no-install vite --host 127.0.0.1 --port 5189 --strictPort > "$RUNNER_TEMP/sites-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; rm -f .dev.vars' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5189/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/sites-preview.log"; exit 1; fi
          python3 tests/http_test.py
